<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tinker Workshops</title>

  <style>
    :root {
      --blue: #9eafbc;
      --cream: #f4eadc;
      --brown: #4b382f;
      --pink: #a98b91;
      --peach: #dfc9ae;
      --paper: #fffaf1;
      --shadow: rgba(47, 35, 28, .18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      color: var(--brown);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.28) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 20%, rgba(255,255,255,.20) 0 4px, transparent 5px),
        var(--blue);
      background-size: 42px 42px, 58px 58px, auto;
    }

    button,
    a {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page-shell {
      width: min(1180px, calc(100% - 30px));
      margin: 0 auto;
      padding: 24px 0 70px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 17px;
      border: 2px solid rgba(75,56,47,.15);
      border-radius: 999px;
      color: var(--brown);
      background: rgba(244,234,220,.88);
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(47,35,28,.10);
      transition: transform .2s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
    }

    .sheet-note {
      font-size: 14px;
      color: rgba(75,56,47,.78);
      text-align: right;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 68px);
      border-radius: 36px;
      background: var(--cream);
      box-shadow: 0 26px 55px var(--shadow);
      isolation: isolate;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      z-index: -1;
    }

    .hero::before {
      width: 230px;
      height: 230px;
      right: -70px;
      top: -100px;
      background: rgba(169,139,145,.28);
    }

    .hero::after {
      width: 170px;
      height: 170px;
      left: -70px;
      bottom: -90px;
      background: rgba(223,201,174,.62);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--pink);
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      font-size: clamp(40px, 8vw, 84px);
      line-height: .95;
      letter-spacing: -.045em;
    }

    .hero p {
      max-width: 700px;
      margin-top: 18px;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin: 28px 0 22px;
    }

    .filter-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-button {
      padding: 11px 17px;
      border: 0;
      border-radius: 999px;
      background: rgba(244,234,220,.78);
      color: var(--brown);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(47,35,28,.10);
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .filter-button:hover {
      transform: translateY(-2px);
    }

    .filter-button.active {
      background: var(--brown);
      color: white;
    }

    .month-select-wrap {
      min-width: 180px;
    }

    .month-select-wrap label {
      display: block;
      margin: 0 0 7px 4px;
      font-size: 14px;
      font-weight: 800;
    }

    .month-select {
      width: 100%;
      padding: 11px 38px 11px 14px;
      border: 0;
      border-radius: 16px;
      color: var(--brown);
      background: rgba(244,234,220,.9);
      font-weight: 700;
      box-shadow: 0 7px 16px rgba(47,35,28,.10);
    }

    .status-message {
      margin: 28px 0;
      padding: 22px;
      border-radius: 22px;
      background: rgba(244,234,220,.88);
      text-align: center;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(47,35,28,.10);
    }

    .status-message.error {
      background: #fff0ec;
      color: #7a332b;
    }

    .month-section {
      margin-top: 34px;
    }

    .month-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 17px;
      font-size: clamp(26px, 4vw, 42px);
    }

    .month-heading::after {
      content: "";
      height: 3px;
      flex: 1;
      border-radius: 999px;
      background: rgba(75,56,47,.25);
    }

    .workshop-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .workshop-card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 27px;
      background: var(--paper);
      box-shadow: 0 18px 34px rgba(47,35,28,.16);
      transform: rotate(var(--tilt, 0deg));
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .workshop-card:hover {
      transform: translateY(-6px) rotate(0deg);
      box-shadow: 0 24px 44px rgba(47,35,28,.22);
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: linear-gradient(135deg, #e8d5c0, #c7d3dc);
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      color: rgba(75,56,47,.72);
    }

    .status-badge {
  position: absolute;
  top: 14px;
  right: 14px;

  padding: 10px 16px;
  border-radius: 999px;

  color: white;
  background: #5f9f72;

  font-size: 16px;
  font-weight: 900;
  letter-spacing: .03em;

  box-shadow: 0 7px 18px rgba(0, 0, 0, .18);
}

.status-badge.full {
  background: #c75b5b;
}

    .status-badge.open {
      background: #228B22;
    }

    .status-badge.soon {
      background: #b77b52;
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 22px;
    }

    .category {
      margin-bottom: 8px;
      color: #826772;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .workshop-title {
      font-size: 27px;
      line-height: 1.05;
    }

    .description {
      margin-top: 11px;
      color: rgba(75,56,47,.76);
      line-height: 1.55;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 20px 0;
    }
    .large-workshop-date {
  width: 100%;
  margin: 4px 0 16px;
  padding: 13px 18px;
  border-radius: 18px;
  background: #d6a58f;
  color: var(--brown);
  text-align: center;
  font-size: 23px;
  font-weight: 900;
}

    .detail {
      padding: 11px 12px;
      border-radius: 15px;
      background: #f3e5d4;
    }

    .detail-label {
      display: block;
      margin-bottom: 3px;
      color: rgba(75,56,47,.62);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .detail-value {
      font-weight: 900;
    }

    .book-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--brown);
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    .book-button:hover {
      transform: translateY(-2px);
    }

    .book-button.ask {
      background: var(--pink);
    }

    .book-button.disabled {
      opacity: .48;
      pointer-events: none;
    }

    .empty-state {
      padding: 40px 24px;
      border-radius: 28px;
      background: rgba(244,234,220,.9);
      text-align: center;
      box-shadow: 0 15px 28px rgba(47,35,28,.12);
    }

    .empty-state h2 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    .empty-state p {
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .workshop-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .page-shell {
        width: min(100% - 18px, 620px);
        padding-top: 12px;
      }

      .top-bar {
        align-items: flex-start;
      }

      .sheet-note {
        max-width: 145px;
        font-size: 12px;
      }

      .hero {
        padding: 30px 22px 34px;
        border-radius: 27px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .month-select-wrap {
        width: 100%;
      }

      .workshop-grid {
        grid-template-columns: 1fr;
      }

      .workshop-card {
        transform: none;
      }

      .workshop-card:hover {
        transform: translateY(-4px);
      }

      .details {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 390px) {
      .filter-button {
        padding: 10px 13px;
        font-size: 14px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    /* ==============================
       TINKER LOADING SCREEN
    ============================== */

    body.loading { overflow: hidden; }

    .tinker-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #9eafbc;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity .6s ease, visibility .6s ease;
    }

    .tinker-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .palette-loader {
      position: relative;
      width: 170px;
      height: 135px;
      animation: paletteFloat 1.7s ease-in-out infinite;
    }

    .palette-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,.16));
    }

    .paint-dot {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 60% 45% 55% 50% / 52% 58% 42% 48%;
      animation: paintPulse 1.3s ease-in-out infinite;
      z-index: 2;
    }

    .dot-1 { background:#df8c66; left:34px; top:34px; animation-delay:0s; }
    .dot-2 { background:#4b6d87; left:70px; top:23px; animation-delay:.15s; }
    .dot-3 { background:#a98b91; left:31px; bottom:29px; animation-delay:.3s; }
    .dot-4 { background:#d5b35d; left:75px; bottom:23px; animation-delay:.45s; }

    .loading-text {
      margin-top: 28px;
      color: #4b382f;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 800;
      text-align: center;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4b382f;
      animation: loaderDot 1s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay:.15s; }
    .loading-dots span:nth-child(3) { animation-delay:.3s; }

    @keyframes paletteFloat {
      0%,100% { transform:translateY(0) rotate(-8deg); }
      50% { transform:translateY(-12px) rotate(-4deg); }
    }

    @keyframes paintPulse {
      0%,100% { transform:scale(1); }
      50% { transform:scale(1.25); }
    }

    @keyframes loaderDot {
      0%,100% { opacity:.3; transform:translateY(0); }
      50% { opacity:1; transform:translateY(-5px); }
    }

  </style>
</head>

<body class="loading">

  <!-- TINKER LOADING SCREEN -->
  <div id="tinkerLoader" class="tinker-loader">
    <div class="palette-loader" aria-hidden="true">
      <svg class="palette-shape" viewBox="0 0 170 135" xmlns="http://www.w3.org/2000/svg">
        <path
          fill="#f4eadc"
          fill-rule="evenodd"
          d="
            M86 7
            C124 5 157 24 162 55
            C167 84 145 111 114 124
            C82 138 38 132 17 107
            C-3 84 3 48 26 26
            C41 12 62 8 86 7
            Z
            M126 34
            C134 32 142 37 143 45
            C144 53 137 60 129 61
            C120 62 114 56 114 48
            C113 40 118 35 126 34
            Z
          "
        />
      </svg>
      <span class="paint-dot dot-1"></span>
      <span class="paint-dot dot-2"></span>
      <span class="paint-dot dot-3"></span>
      <span class="paint-dot dot-4"></span>
    </div>
    <p class="loading-text">Tinkering things together...</p>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <main class="page-shell">
    <div class="top-bar">
      <a class="back-link" href="index.html">← Back to Tinker</a>
      <p class="sheet-note">Workshop details update automatically from Google Sheets.</p>
    </div>

    <header class="hero">
      <span class="eyebrow">Create with us</span>
      <h1>Tinker Workshops</h1>
      <p>
        Pick a workshop, check the details, and book directly through WhatsApp.
        New workshops are added regularly.
      </p>
    </header>

    <section class="controls" aria-label="Workshop filters">
      <div class="filter-area" id="filterArea">
        <button class="filter-button active" type="button" data-filter="All">All</button>
        <button class="filter-button" type="button" data-filter="Kids">Kids</button>
        <button class="filter-button" type="button" data-filter="Teens & Adults">Teens & Adults</button>
        <button class="filter-button" type="button" data-filter="All Ages">All Ages</button>
      </div>

      <div class="month-select-wrap">
        <label for="monthSelect">Choose a month</label>
        <select class="month-select" id="monthSelect">
          <option value="All">All months</option>
        </select>
      </div>
    </section>

    <div id="statusMessage" class="status-message">Loading workshops…</div>
    <div id="workshopList"></div>
  </main>

  <script>

    /* ==============================
       TINKER LOADING SCREEN
       Waits for page + workshop sheet
    ============================== */

    const loaderStartTime = Date.now();
    let pageLoaded = false;
    let workshopsLoaded = false;

    function finishTinkerLoader() {
      if (!pageLoaded || !workshopsLoaded) return;

      const loader = document.getElementById("tinkerLoader");
      const minimumLoaderTime = 900;
      const elapsed = Date.now() - loaderStartTime;
      const remainingTime = Math.max(minimumLoaderTime - elapsed, 0);

      setTimeout(() => {
        loader.classList.add("loaded");
        document.body.classList.remove("loading");
      }, remainingTime);
    }

    window.addEventListener("load", () => {
      pageLoaded = true;
      finishTinkerLoader();
    });

    const SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKdezZ7a3TddMr1uUWTx8_wn3yiVpjFsMFJvBGZv4IoC2WbKiiwLQZDk8nPfS_VcFQIfxD0LQj--rR/pub?gid=0&single=true&output=csv";

    const WHATSAPP_NUMBER = "96179438713";

    const workshopList = document.getElementById("workshopList");
    const statusMessage = document.getElementById("statusMessage");
    const filterArea = document.getElementById("filterArea");
    const monthSelect = document.getElementById("monthSelect");

    let workshops = [];
    let selectedCategory = "All";
    let selectedMonth = "All";

    function normalizeHeader(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }

    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const character = csvText[i];
        const nextCharacter = csvText[i + 1];

        if (character === '"' && insideQuotes && nextCharacter === '"') {
          value += '"';
          i++;
        } else if (character === '"') {
          insideQuotes = !insideQuotes;
        } else if (character === "," && !insideQuotes) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !insideQuotes) {
          if (character === "\r" && nextCharacter === "\n") i++;
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);

      if (rows.length < 2) return [];

      const headers = rows[0].map(normalizeHeader);

      return rows.slice(1).map(cells => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = (cells[index] || "").trim();
        });
        return item;
      });
    }

    function getField(item, possibleNames) {
      for (const name of possibleNames) {
        const normalizedName = normalizeHeader(name);
        if (item[normalizedName] !== undefined && item[normalizedName] !== "") {
          return item[normalizedName];
        }
      }
      return "";
    }

    function parseWorkshopDate(dateValue) {
      if (!dateValue) return null;

      const cleanDate = dateValue.trim();

      // Reliable handling for YYYY-MM-DD
      const isoMatch = cleanDate.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (isoMatch) {
        return new Date(
          Number(isoMatch[1]),
          Number(isoMatch[2]) - 1,
          Number(isoMatch[3])
        );
      }

      // Handles dates such as August 20, 2026, Aug 20, or Google Sheet dates.
      const parsed = new Date(cleanDate);

      if (Number.isNaN(parsed.getTime())) return null;

      // Google Sheets sometimes exports a date without a chosen year as 2001.
      // For the workshop calendar, treat that as the current year.
      if (parsed.getFullYear() <= 2001) {
        parsed.setFullYear(new Date().getFullYear());
      }

      return parsed;
    }

    function formatDate(date, originalValue) {
      if (!date) return originalValue || "Date to be announced";

      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "long",
        day: "numeric"
      }).format(date);
    }

    function monthKey(date) {
      if (!date) return "Date to be announced";

      return new Intl.DateTimeFormat("en-US", {
        month: "long"
      }).format(date);
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function makeWhatsAppLink(workshop, mode) {
      const title = workshop.title || "this workshop";
      const dateText = formatDate(workshop.dateObject, workshop.date);
      const timeText = workshop.time ? ` at ${workshop.time}` : "";

      const message = mode === "ask"
        ? `Hello! I would like to ask about the ${title} workshop${workshop.date ? ` on ${dateText}` : ""}${timeText}.`
        : `Hello! I would like to book the ${title} workshop${workshop.date ? ` on ${dateText}` : ""}${timeText}.`;

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    function buildWorkshop(raw, index) {
      const date = getField(raw, ["date"]);
      const dateObject = parseWorkshopDate(date);

      return {
        id: index,
        title: getField(raw, ["title", "workshop"]),
        date,
        dateObject,
        time: getField(raw, ["time"]),
        category: getField(raw, ["category"]) || "All Ages",
        age: getField(raw, ["age", "ages"]),
        workshopSize: getField(raw, [
          "workshopSize",
          "workshop size",
          "spots",
          "participants"
        ]),
        description: getField(raw, ["description"]),
        image: getField(raw, ["image", "image url", "imageurl"]),
        status: getField(raw, ["status"]) || "Open"
      };
    }

    function statusClass(status) {
      const normalized = status.toLowerCase();

      if (normalized === "full") return "full";
      if (normalized === "coming soon") return "soon";
      return "";
    }

    function createCard(workshop, index) {
      const status = workshop.status.trim();
      const normalizedStatus = status.toLowerCase();

      let buttonHTML = "";

      if (normalizedStatus === "full") {
        buttonHTML = `
          <span class="book-button disabled" aria-disabled="true">
            Workshop Full
          </span>
        `;
      } else if (normalizedStatus === "coming soon") {
        buttonHTML = `
          <a
            class="book-button ask"
            href="${makeWhatsAppLink(workshop, "ask")}"
            target="_blank"
            rel="noopener"
          >
            Ask on WhatsApp
          </a>
        `;
      } else {
        buttonHTML = `
          <a
            class="book-button"
            href="${makeWhatsAppLink(workshop, "book")}"
            target="_blank"
            rel="noopener"
          >
            Book on WhatsApp
          </a>
        `;
      }

      const imageHTML = workshop.image
        ? `
          <img
            src="${escapeHTML(workshop.image)}"
            alt="${escapeHTML(workshop.title || "Workshop")}"
            loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
          >
          <div class="image-fallback" style="display:none;">
            ${escapeHTML(workshop.title || "Tinker Workshop")}
          </div>
        `
        : `
          <div class="image-fallback">
            ${escapeHTML(workshop.title || "Tinker Workshop")}
          </div>
        `;

     const details = [
  workshop.workshopSize
    ? `
      <div class="detail">
        <span class="detail-label">Workshop size</span>
        <span class="detail-value">
          ${escapeHTML(workshop.workshopSize)} participants
        </span>
      </div>
    `
    : "",

  workshop.time
    ? `
      <div class="detail">
        <span class="detail-label">Time</span>
        <span class="detail-value">${escapeHTML(workshop.time)}</span>
      </div>
    `
    : "",

  workshop.age
    ? `
      <div class="detail">
        <span class="detail-label">Ages</span>
        <span class="detail-value">${escapeHTML(workshop.age)}</span>
      </div>
    `
    : ""
].join("");


      const tiltValues = ["-1.2deg", ".8deg", "-.5deg", "1.1deg"];
      const tilt = tiltValues[index % tiltValues.length];

      return `
        <article class="workshop-card" style="--tilt:${tilt}">
          <div class="image-wrap">
            ${imageHTML}
            <span class="status-badge ${statusClass(status)}">
              ${escapeHTML(status)}
            </span>
          </div>

          <div class="card-body">
            <p class="category">${escapeHTML(workshop.category)}</p>
            <h2 class="workshop-title">${escapeHTML(workshop.title || "Untitled Workshop")}</h2>

            ${
              workshop.description
                ? `<p class="description">${escapeHTML(workshop.description)}</p>`
                : ""
            }

            <div class="details">${details}</div>

            ${
  workshop.date || workshop.dateObject
    ? `
      <div class="large-workshop-date">
        ${escapeHTML(formatDate(workshop.dateObject, workshop.date))}
      </div>
    `
    : ""
}

${buttonHTML}
</div>
</article>
`;
    }

    function updateMonthOptions() {
      const uniqueMonths = [...new Set(
        workshops
          .filter(workshop => workshop.status.toLowerCase() !== "hidden")
          .map(workshop => monthKey(workshop.dateObject))
      )];

      monthSelect.innerHTML = `
        <option value="All">All months</option>
        ${uniqueMonths.map(month => `
          <option value="${escapeHTML(month)}">${escapeHTML(month)}</option>
        `).join("")}
      `;
    }

    function renderWorkshops() {
      const visibleWorkshops = workshops
        .filter(workshop => workshop.status.toLowerCase() !== "hidden")
        .filter(workshop => {
          const categoryMatches =
            selectedCategory === "All" ||
            workshop.category.toLowerCase() === selectedCategory.toLowerCase();

          const monthMatches =
            selectedMonth === "All" ||
            monthKey(workshop.dateObject) === selectedMonth;

          return categoryMatches && monthMatches;
        })
        .sort((a, b) => {
          if (!a.dateObject && !b.dateObject) return 0;
          if (!a.dateObject) return 1;
          if (!b.dateObject) return -1;
          return a.dateObject - b.dateObject;
        });

      if (visibleWorkshops.length === 0) {
        workshopList.innerHTML = `
          <div class="empty-state">
            <h2>No workshops here yet</h2>
            <p>
              Try another category or month. New workshops are added regularly.
            </p>
          </div>
        `;
        return;
      }

      const groups = {};

      visibleWorkshops.forEach(workshop => {
        const key = monthKey(workshop.dateObject);
        if (!groups[key]) groups[key] = [];
        groups[key].push(workshop);
      });

      workshopList.innerHTML = Object.entries(groups).map(([month, items]) => `
        <section class="month-section">
          <h2 class="month-heading">${escapeHTML(month)}</h2>
          <div class="workshop-grid">
            ${items.map((workshop, index) => createCard(workshop, index)).join("")}
          </div>
        </section>
      `).join("");
    }

    filterArea.addEventListener("click", event => {
      const button = event.target.closest(".filter-button");
      if (!button) return;

      selectedCategory = button.dataset.filter;

      document.querySelectorAll(".filter-button").forEach(item => {
        item.classList.toggle("active", item === button);
      });

      renderWorkshops();
    });

    monthSelect.addEventListener("change", () => {
      selectedMonth = monthSelect.value;
      renderWorkshops();
    });

  async function loadWorkshops() {
  try {
    const freshURL = SHEET_CSV_URL + "&t=" + Date.now();

    const response = await fetch(freshURL, {
      cache: "no-store"
    });

        if (!response.ok) {
          throw new Error(`Google Sheets returned ${response.status}.`);
        }

        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);

        workshops = parsedRows
          .map(buildWorkshop)
          .filter(workshop => workshop.title);

        statusMessage.style.display = "none";

        updateMonthOptions();
        renderWorkshops();
      } catch (error) {
        console.error(error);

        statusMessage.classList.add("error");
        statusMessage.innerHTML = `
          The workshops could not load. Make sure the Google Sheet is still
          published as CSV, then refresh this page.
        `;
      } finally {
        /* Remove the palette only after the live workshop data has finished. */
        workshopsLoaded = true;
        finishTinkerLoader();
      }
    }

    loadWorkshops();
  </script>
</body>
</html>
